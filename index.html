<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="form1" style="text-align: center;">
        <fieldset style="width: 300px; align-items: center; border: 2px solid black;">
            <legend style="text-align: center; font-weight: bold; background-color: gold;">Student Registration Form</legend>
        <input id="name" type="text" placeholder=" Enter name" style="border: 2px solid black; "><br><br>
        <input id="email" type="email" placeholder=" Enter email" style="border: 2px solid black; "><br><br>
        <input id="age" type="number" placeholder="Enter the age" style="border: 2px solid black; "><br><br>
        <input id="course" type="text" placeholder=" Enter course" style="border: 2px solid black; "><br><br>
        <button type="submit" style="width: 90px; height: 30px; background-color: aqua;">Register</button>
        </fieldset>
    </form>
    <p id="message"></p>
    <h3>Registered Students</h3>
    <table border="1" id="studenttable">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Course</th>
        </tr>
    </table>
    <script src="student.js"></script>
</body>
</html>
